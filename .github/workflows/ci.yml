name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Validate project
        run: uv run python scripts/project.py check

      - name: Diagnose a fresh clone
        run: uv run python scripts/project.py doctor

  windows-workbench:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --frozen

      - name: Validate project
        run: uv run python scripts/project.py check

      - name: Diagnose a fresh clone
        run: uv run python scripts/project.py doctor

  macos-workbench:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --frozen

      - name: Validate project
        run: uv run python scripts/project.py check

      - name: Diagnose a fresh clone
        run: uv run python scripts/project.py doctor

      - name: Check workbench shell scripts parse
        run: bash -n config/workbench-env.sh
