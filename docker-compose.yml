services:
  db:
    image: postgres:14
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - ./.env_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  mygpt_backend:
    build: ./MyGPT_backend
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "python3 manage.py migrate --fake sessions zero && python3 manage.py migrate --fake-initial && python3 manage.py ensure_demo_dataset && python3 manage.py collectstatic --no-input && python3 manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./MyGPT_backend:/code
      - ./MyGPT_backend/static:/static
      - ./MyGPT_backend/media:/media
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env_backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    links:
      - db